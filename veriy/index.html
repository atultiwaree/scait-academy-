<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Certificate Verification — SCAIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    :root {
      --orange: #e66030;
      --orange-light: #ff7a47;
      --orange-glow: rgba(230,96,48,0.3);
      --navy: #002147;
      --navy-dim: rgba(0,33,71,0.06);
      --white: #ffffff;
      --off: #f8f7f5;
      --muted: #7c8597;
      --border: rgba(0,33,71,0.09);
      --green: #0f9e6e;
      --green-bg: rgba(15,158,110,0.09);
      --red: #d94040;
      --red-bg: rgba(217,64,64,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* BG */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg-layer::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 90% 10%, rgba(230,96,48,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 10% 90%, rgba(230,96,48,0.1) 0%, transparent 55%),
        linear-gradient(160deg, #002147 0%, #001530 60%, #000d20 100%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.5;
    }
    .orb-1 { width:300px;height:300px;background:var(--orange);top:-80px;right:-80px;animation:orbF1 9s ease-in-out infinite alternate; }
    .orb-2 { width:200px;height:200px;background:#1a4a8a;bottom:10%;left:-60px;animation:orbF2 12s ease-in-out infinite alternate; }
    .orb-3 { width:150px;height:150px;background:var(--orange-light);top:50%;right:5%;animation:orbF1 7s ease-in-out 2s infinite alternate;opacity:0.2; }
    .bg-dots {
      position:absolute;inset:0;
      background-image:radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1px);
      background-size:28px 28px;
    }
    .bg-lines {
      position:absolute;inset:0;
      background:repeating-linear-gradient(-55deg,transparent,transparent 60px,rgba(255,255,255,0.012) 60px,rgba(255,255,255,0.012) 61px);
    }
    @keyframes orbF1 { from{transform:translate(0,0) scale(1)} to{transform:translate(-30px,30px) scale(1.15)} }
    @keyframes orbF2 { from{transform:translate(0,0) scale(1)} to{transform:translate(25px,-25px) scale(1.1)} }

    /* PAGE */
    .page {
      position:relative;z-index:1;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;
      padding:36px 16px 64px;
    }

    /* HEADER */
    .site-header {
      text-align:center;margin-bottom:32px;
      animation:slideDown 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    .cap-wrap {
      position:relative;width:120px;height:120px;margin:0 auto 12px;
    }
    /* Lottie fills the cap-wrap */
    #lottie-cap {
      width:100%;height:100%;
      filter:drop-shadow(0 0 22px var(--orange-glow));
    }
    /* Animated SVG fallback cap */
    #svg-fallback {
      display:none;
      position:absolute;inset:0;
      animation:capBob 3s ease-in-out infinite;
      filter:drop-shadow(0 0 18px rgba(230,96,48,0.5));
    }
    @keyframes capBob {
      0%,100%{transform:translateY(0) rotate(-2deg)}
      50%{transform:translateY(-9px) rotate(2deg)}
    }
    /* Sparkles */
    .sparkle {
      position:absolute;font-size:14px;
      animation:sparkleAnim 2.6s ease-in-out infinite;opacity:0;
      pointer-events:none;
    }
    .sp1{top:-6px;left:46%;animation-delay:0s;}
    .sp2{top:10px;right:-2px;animation-delay:0.45s;}
    .sp3{top:10px;left:-2px;animation-delay:0.9s;}
    .sp4{bottom:4px;right:6px;animation-delay:1.35s;}
    .sp5{bottom:4px;left:6px;animation-delay:1.8s;}
    @keyframes sparkleAnim {
      0%{opacity:0;transform:scale(0.5) translateY(4px)}
      40%{opacity:1;transform:scale(1.3) translateY(-7px)}
      100%{opacity:0;transform:scale(0.7) translateY(-14px)}
    }

    .site-header h1 {
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(24px,6vw,36px);font-weight:700;
      color:var(--white);letter-spacing:-0.3px;line-height:1.1;
    }
    .site-header h1 span{color:var(--orange);}
    .site-header p {
      font-size:11.5px;color:rgba(255,255,255,0.42);
      margin-top:7px;letter-spacing:1.8px;text-transform:uppercase;font-weight:500;
    }

    /* CARD */
    .card {
      background:var(--white);border-radius:24px;
      box-shadow:0 2px 0 rgba(255,255,255,0.1) inset,0 30px 80px rgba(0,0,0,0.35),0 0 0 1px rgba(255,255,255,0.06);
      max-width:540px;width:100%;overflow:hidden;
      animation:slideUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.15s both;
    }
    .card-topbar {
      height:4px;
      background:linear-gradient(90deg,var(--navy) 0%,var(--orange) 40%,var(--orange-light) 70%,var(--navy) 100%);
      background-size:200% 100%;animation:shimmer 3s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .card-body{padding:28px 24px 24px;}

    /* ID CHIP */
    .id-chip {
      display:inline-flex;align-items:center;gap:8px;
      background:var(--navy-dim);border:1px solid var(--border);
      border-radius:100px;padding:6px 14px 6px 10px;margin-bottom:20px;
    }
    .pulse-dot {
      width:8px;height:8px;border-radius:50%;background:var(--orange);
      animation:pulseDot 1.8s ease-in-out infinite;
    }
    .id-chip span{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:0.8px;text-transform:uppercase;}
    @keyframes pulseDot {
      0%,100%{box-shadow:0 0 0 0 rgba(230,96,48,0.5)}
      50%{box-shadow:0 0 0 5px rgba(230,96,48,0)}
    }

    /* STATUS */
    .status {
      display:flex;align-items:center;gap:12px;
      padding:14px 18px;border-radius:14px;margin-bottom:24px;
      font-weight:600;font-size:14px;
      transition:all 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .status-ico {
      width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:15px;flex-shrink:0;
    }
    .status.loading  {background:rgba(0,33,71,0.05);border:1.5px solid rgba(0,33,71,0.1);color:var(--navy);}
    .status.verified {background:var(--green-bg);border:1.5px solid rgba(15,158,110,0.25);color:#065f46;}
    .status.invalid  {background:var(--red-bg);border:1.5px solid rgba(217,64,64,0.2);color:#7f1d1d;}
    .status.loading .status-ico  {background:rgba(0,33,71,0.07);}
    .status.verified .status-ico {background:rgba(15,158,110,0.15);}
    .status.invalid  .status-ico {background:rgba(217,64,64,0.12);}
    .spin-ring {
      width:18px;height:18px;border:2.5px solid rgba(0,33,71,0.15);
      border-top-color:var(--navy);border-radius:50%;animation:spin 0.7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* PROFILE */
    .profile {
      display:flex;gap:18px;align-items:flex-start;
      background:var(--off);border:1.5px solid var(--border);
      border-radius:18px;padding:20px;margin-bottom:20px;
    }
    .photo-frame{position:relative;flex-shrink:0;}
    .photo-frame img {
      width:76px;height:92px;object-fit:cover;border-radius:12px;
      border:3px solid white;box-shadow:0 6px 18px rgba(0,33,71,0.18);display:block;
    }
    .photo-badge {
      position:absolute;bottom:-7px;right:-7px;
      width:24px;height:24px;border-radius:50%;border:2.5px solid white;
      background:var(--green);display:flex;align-items:center;justify-content:center;
      font-size:10px;color:white;font-weight:700;box-shadow:0 2px 8px rgba(15,158,110,0.4);
    }
    .profile-info{flex:1;min-width:0;}
    .pname {
      font-family:'Cormorant Garamond',serif;font-size:clamp(18px,4.5vw,24px);
      font-weight:700;color:var(--navy);line-height:1.15;
    }
    .pparents{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.7;}
    .ptags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
    .ptag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;letter-spacing:0.2px;}
    .ptag-o{background:rgba(230,96,48,0.1);color:var(--orange);}
    .ptag-n{background:rgba(0,33,71,0.07);color:var(--navy);}
    .ptag-g{background:var(--green-bg);color:var(--green);}

    /* DETAILS */
    .details{border:1.5px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:22px;}
    .drow {
      display:flex;align-items:center;padding:11px 18px;
      border-bottom:1px solid var(--border);transition:background 0.2s;
    }
    .drow:last-child{border-bottom:none;}
    .drow:hover{background:var(--off);}
    .dlabel{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;width:44%;flex-shrink:0;}
    .dval{font-size:13.5px;font-weight:500;color:#1a1a2e;}
    .dval b{color:var(--navy);font-weight:700;}

    /* SEAL */
    .seal-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 6px;}
    .seal{position:relative;width:110px;height:110px;}
    .seal-outer{position:absolute;inset:0;animation:rotateCW 18s linear infinite;}
    .seal-inner-ring{position:absolute;inset:8px;animation:rotateCCW 12s linear infinite;}
    .seal-center {
      position:absolute;inset:22px;
      background:linear-gradient(135deg,var(--orange),var(--orange-light));
      border-radius:50%;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      color:white;font-size:9px;font-weight:700;text-transform:uppercase;
      letter-spacing:0.4px;text-align:center;line-height:1.5;
      box-shadow:0 0 0 2px white,0 6px 20px rgba(230,96,48,0.45);
    }
    .seal-check{font-size:20px;margin-bottom:1px;}
    @keyframes rotateCW{to{transform:rotate(360deg)}}
    @keyframes rotateCCW{to{transform:rotate(-360deg)}}
    .seal-caption{font-size:11.5px;color:var(--muted);margin-top:12px;text-align:center;line-height:1.6;}

    /* NOT FOUND */
    .not-found{text-align:center;padding:36px 16px;}
    .nf-icon{font-size:54px;display:block;margin-bottom:14px;animation:nfBounce 2s ease-in-out infinite;}
    @keyframes nfBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .nf-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px;}
    .nf-text{font-size:13.5px;color:var(--muted);line-height:1.65;}
    .retry-btn {
      display:inline-flex;align-items:center;gap:7px;margin-top:18px;
      padding:11px 22px;background:var(--navy);color:white;border:none;
      border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;
      font-family:'Plus Jakarta Sans',sans-serif;
      transition:background 0.25s,transform 0.2s,box-shadow 0.2s;
      box-shadow:0 4px 14px rgba(0,33,71,0.25);
    }
    .retry-btn:hover{background:var(--orange);transform:translateY(-2px);box-shadow:0 6px 18px rgba(230,96,48,0.4);}
    .retry-btn:active{transform:translateY(0);}

    /* FOOTER */
    .card-footer {
      display:flex;align-items:center;justify-content:space-between;
      padding:13px 24px;background:var(--off);border-top:1.5px solid var(--border);
      flex-wrap:wrap;gap:6px;
    }
    .card-footer span{font-size:11px;color:var(--muted);font-weight:500;}
    .card-footer .brand{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:0.3px;}

    /* ANIMATIONS */
    @keyframes slideDown{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}
    @keyframes popIn{0%{opacity:0;transform:scale(0.85)}65%{transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
    .anim-pop{animation:popIn 0.55s cubic-bezier(0.16,1,0.3,1) both;}
    .anim-up {animation:slideUp 0.55s cubic-bezier(0.16,1,0.3,1) both;}
    .d1{animation-delay:0.08s;} .d2{animation-delay:0.16s;} .d3{animation-delay:0.24s;}

    /* MOBILE */
    @media(max-width:480px){
      .page{padding:24px 12px 48px;}
      .card-body{padding:22px 16px 18px;}
      .profile{flex-direction:column;align-items:center;text-align:center;gap:14px;}
      .photo-frame{margin:0 auto;}
      .ptags{justify-content:center;}
      .dlabel{width:46%;font-size:10.5px;}
      .dval{font-size:13px;}
      .card-footer{justify-content:center;text-align:center;}
      .site-header h1{font-size:26px;}
      .cap-wrap{width:100px;height:100px;}
    }
  </style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-dots"></div>
  <div class="bg-lines"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="page">

  <header class="site-header">
    <div class="cap-wrap">
      <!-- Sparkles -->
      <span class="sparkle sp1">✦</span>
      <span class="sparkle sp2">✦</span>
      <span class="sparkle sp3">✦</span>
      <span class="sparkle sp4">✦</span>
      <span class="sparkle sp5">✦</span>

      <!-- Lottie will render here -->
      <div id="lottie-cap"></div>

      <!-- SVG Fallback graduation cap -->
      <svg id="svg-fallback" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Board top -->
        <polygon points="50,14 92,36 50,52 8,36" fill="#e66030" opacity="0.95"/>
        <!-- Cap body/dome -->
        <path d="M22,36 Q22,62 50,68 Q78,62 78,36" fill="#002147"/>
        <!-- Sheen on cap -->
        <path d="M28,38 Q38,55 50,58 Q36,54 28,38 Z" fill="rgba(255,255,255,0.08)"/>
        <!-- Board underside -->
        <polygon points="50,14 92,36 50,52 8,36" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
        <!-- Tassel cord -->
        <line x1="92" y1="36" x2="92" y2="60" stroke="#e66030" stroke-width="3" stroke-linecap="round"/>
        <!-- Tassel ball -->
        <circle cx="92" cy="63" r="5" fill="#e66030"/>
        <!-- Tassel fringe -->
        <line x1="89" y1="63" x2="87" y2="73" stroke="#ff7a47" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="92" y1="63" x2="92" y2="74" stroke="#ff7a47" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="95" y1="63" x2="97" y2="73" stroke="#ff7a47" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Diploma scroll on body -->
        <rect x="37" y="55" width="26" height="18" rx="3" fill="#faf9f7" stroke="rgba(230,96,48,0.4)" stroke-width="1.2"/>
        <line x1="42" y1="61" x2="58" y2="61" stroke="#002147" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="42" y1="65" x2="54" y2="65" stroke="#002147" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
        <line x1="37" y1="64" x2="63" y2="64" stroke="#e66030" stroke-width="2" opacity="0.35"/>
        <!-- Star on board -->
        <text x="44" y="37" font-size="10" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="serif">★</text>
      </svg>
    </div>

    <h1>Certificate <span>Verification</span></h1>
    <p>Student Computer Academy of Information Technology</p>
  </header>

  <div class="card">
    <div class="card-topbar"></div>
    <div class="card-body">

      <div class="id-chip">
        <div class="pulse-dot"></div>
        <span id="id-label">Loading…</span>
      </div>

      <div class="status loading" id="status">
        <div class="status-ico"><div class="spin-ring"></div></div>
        <div>
          <div style="font-weight:700;font-size:14px;">Verifying Certificate</div>
          <div style="font-size:12px;opacity:0.65;font-weight:400;margin-top:2px;">Please wait a moment…</div>
        </div>
      </div>

      <div id="result"></div>

    </div>
    <div class="card-footer">
      <span>🔒 Secure Digital Verification</span>
      <span class="brand">SCAIT © 2025</span>
    </div>
  </div>

</div>

<script>
// ── Lottie loader with fallback ──
(function() {
  const container = document.getElementById('lottie-cap');
  const fallback  = document.getElementById('svg-fallback');

  function showFallback() {
    container.style.display = 'none';
    fallback.style.display  = 'block';
  }

  try {
    const anim = lottie.loadAnimation({
      container,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      // Free graduation cap Lottie from LottieFiles
      path: 'https://assets9.lottiefiles.com/packages/lf20_uu0x8lqv.json'
    });
    anim.addEventListener('data_failed', showFallback);
    anim.addEventListener('data_ready',  function() { fallback.style.display = 'none'; });
    setTimeout(function() { if (!anim.isLoaded) showFallback(); }, 5000);
  } catch(e) {
    showFallback();
  }
})();

// ── Verification logic ──
const parts = window.location.pathname.split('/').filter(Boolean);
const id    = parts[parts.length - 1] || '';

const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const labelEl  = document.getElementById('id-label');

function setStatus(type, icon, title, sub) {
  statusEl.className = 'status ' + type;
  statusEl.innerHTML = `
    <div class="status-ico">${icon}</div>
    <div>
      <div style="font-weight:700;font-size:14px;">${title}</div>
      ${sub ? `<div style="font-size:12px;opacity:0.65;font-weight:400;margin-top:2px;">${sub}</div>` : ''}
    </div>`;
}

if (!id || ['veriy','verify',''].includes(id.toLowerCase())) {
  labelEl.textContent = 'No ID';
  setStatus('invalid', '✕', 'No ID Found', 'No enrollment number was found in the URL.');
} else {
  labelEl.textContent = id.toUpperCase();

  const controller = new AbortController();
  const wakeTimer  = setTimeout(() => controller.abort(), 22000);

  fetch(`https://scaitbackend.onrender.com/verify/${id}`, { signal: controller.signal })
    .then(r => { clearTimeout(wakeTimer); return r.json(); })
    .then(data => {
      if (data.verified) {
        const d = data.data;
        setStatus('verified', '✔', 'Certificate Verified', 'This certificate is authentic and valid.');

        resultEl.innerHTML = `
          <div class="profile anim-pop">
            <div class="photo-frame">
              <img src="${d.photo}" alt="${d.studentName}"
                onerror="this.parentElement.innerHTML='<div style=&quot;width:76px;height:92px;border-radius:12px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:32px;&quot;>👤</div>'">
              <div class="photo-badge">✔</div>
            </div>
            <div class="profile-info">
              <div class="pname">${d.studentName}</div>
              <div class="pparents">
                S/o or D/o <b>${d.fatherName}</b><br>
                M/o <b>${d.motherName}</b>
              </div>
              <div class="ptags">
                <span class="ptag ptag-o">${d.courseName}</span>
                <span class="ptag ptag-n">Session ${d.session}</span>
                <span class="ptag ptag-g">Grade ${d.overallGrade} · ${d.totalPercentage}%</span>
              </div>
            </div>
          </div>

          <div class="details anim-up d1">
            <div class="drow"><span class="dlabel">Enrollment No.</span><span class="dval"><b>${d.enrollmentNumber}</b></span></div>
            <div class="drow"><span class="dlabel">Roll Number</span><span class="dval">${d.rollNumber}</span></div>
            <div class="drow"><span class="dlabel">Course</span><span class="dval">${d.courseName}</span></div>
            <div class="drow"><span class="dlabel">Duration</span><span class="dval">${d.duration}</span></div>
            <div class="drow"><span class="dlabel">Session</span><span class="dval">${d.session}</span></div>
            <div class="drow"><span class="dlabel">Overall Grade</span><span class="dval"><b>${d.overallGrade}</b></span></div>
            <div class="drow"><span class="dlabel">Percentage</span><span class="dval"><b>${d.totalPercentage}%</b></span></div>
            <div class="drow"><span class="dlabel">Date of Issue</span><span class="dval">${d.dateOfIssue}</span></div>
          </div>

          <div class="seal-wrap anim-up d2">
            <div class="seal">
              <svg class="seal-outer" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
                <path id="op" d="M55,55 m-47,0 a47,47 0 1,1 94,0 a47,47 0 1,1 -94,0" fill="none"/>
                <text font-size="9" font-family="Plus Jakarta Sans,sans-serif" font-weight="700" fill="#002147" opacity="0.55" letter-spacing="3.4">
                  <textPath href="#op">SCAIT · VERIFIED · AUTHENTIC · CERTIFIED · </textPath>
                </text>
              </svg>
              <svg class="seal-inner-ring" viewBox="0 0 94 94" xmlns="http://www.w3.org/2000/svg">
                <circle cx="47" cy="47" r="43" fill="none" stroke="#e66030" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>
              </svg>
              <div class="seal-center">
                <span class="seal-check">✔</span>
                <span>VALID</span>
                <span>CERT</span>
              </div>
            </div>
            <p class="seal-caption">Digitally verified by<br><strong style="color:var(--navy)">Student Computer Academy of IT</strong></p>
          </div>`;

      } else {
        setStatus('invalid', '✕', 'Not Found', data.message || 'No certificate record found.');
        resultEl.innerHTML = `
          <div class="not-found anim-pop">
            <span class="nf-icon">🔍</span>
            <div class="nf-title">No Record Found</div>
            <p class="nf-text">We couldn't find a certificate for<br><strong>${id}</strong>.<br>Please check the number and try again.</p>
            <button class="retry-btn" onclick="window.location.reload()">↺ &nbsp;Try Again</button>
          </div>`;
      }
    })
    .catch(err => {
      if (err.name === 'AbortError') {
        setStatus('invalid', '⏱', 'Server Waking Up', 'Render free tier takes ~30s to start.');
        resultEl.innerHTML = `
          <div class="not-found anim-pop">
            <span class="nf-icon">⏳</span>
            <div class="nf-title">Server Is Starting</div>
            <p class="nf-text">The server is warming up on Render.<br>Please wait 30 seconds and retry.</p>
            <button class="retry-btn" onclick="window.location.reload()">↺ &nbsp;Retry Now</button>
          </div>`;
      } else {
        setStatus('invalid', '✕', 'Connection Error', 'Could not reach verification server.');
        resultEl.innerHTML = `
          <div class="not-found anim-pop">
            <span class="nf-icon">📡</span>
            <div class="nf-title">Connection Failed</div>
            <p class="nf-text">Please check your internet connection<br>and try again.</p>
            <button class="retry-btn" onclick="window.location.reload()">↺ &nbsp;Retry</button>
          </div>`;
      }
    });
}
</script>
</body>
</html>
