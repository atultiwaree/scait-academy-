<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50" fill="none">
    <defs>
        <linearGradient id="shieldEmber" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FB923C"/>
            <stop offset="100%" stop-color="#EA580C"/>
        </linearGradient>
        <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06182E"/>
            <stop offset="100%" stop-color="#0E2A4D"/>
        </linearGradient>
    </defs>

    <!-- ── Emblem: Academic Shield with Upward Soaring Career Arrow (Lakshya) ── -->
    <g transform="translate(6, 4)">
        <!-- Academic Shield Base -->
        <path d="M 21 2 L 38 7 C 38 21, 31 34, 21 41 C 11 34, 4 21, 4 7 Z" fill="#06182E" stroke="url(#shieldEmber)" stroke-width="2"/>
        
        <!-- Inner Shield Accent Wing (Left Navy / Right Ember) -->
        <path d="M 21 5 L 35 9 C 35 20, 29 31, 21 37 Z" fill="rgba(255,255,255,0.06)"/>
        
        <!-- The Soaring Arrow of Progress & Focus (Teer / Lakshya) -->
        <!-- Central Arrowhead -->
        <polygon points="21,9 28,19 23,17 23,28 19,28 19,17 14,19" fill="url(#shieldEmber)"/>
        
        <!-- Open Book of Knowledge / Bow Wings at Arrow Base -->
        <path d="M 12 31 C 15 29, 18 29, 21 31 C 24 29, 27 29, 30 31" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 14 34 C 17 32, 19 32, 21 33 C 23 32, 25 32, 28 34" stroke="url(#shieldEmber)" stroke-width="1.5" stroke-linecap="round"/>
        
        <!-- Star of Academic Excellence at Top -->
        <polygon points="21,5 21.8,6.8 23.8,6.8 22.2,8 22.8,9.8 21,8.6 19.2,9.8 19.8,8 18.2,6.8 20.2,6.8" fill="#F59E0B"/>
    </g>

    <!-- ── Typography: Authoritative Institutional Brand ── -->
    <g transform="translate(54, 0)">
        <!-- Top Institutional Credibility Tag -->
        <text x="0" y="14" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#EA580C" letter-spacing="1.2">SINCE 2008 <tspan fill="#94A3B8">•</tspan> GOVT. REG.</text>

        <!-- Main Brand Title: SCAIT.IN -->
        <text x="0" y="33" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#06182E" letter-spacing="-0.5">SCAIT<tspan fill="url(#shieldEmber)">.IN</tspan></text>

        <!-- Subtitle: Student Computer Academy -->
        <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="0.5">STUDENT COMPUTER ACADEMY</text>
    </g>
</svg>
