<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50" fill="none">
    <defs>
        <linearGradient id="shieldEmberLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FB923C"/>
            <stop offset="100%" stop-color="#EA580C"/>
        </linearGradient>
    </defs>

    <!-- ── Emblem: Academic Shield with Upward Soaring Arrow (Dark Background) ── -->
    <g transform="translate(6, 4)">
        <path d="M 21 2 L 38 7 C 38 21, 31 34, 21 41 C 11 34, 4 21, 4 7 Z" fill="#040D1A" stroke="url(#shieldEmberLight)" stroke-width="2"/>
        <path d="M 21 5 L 35 9 C 35 20, 29 31, 21 37 Z" fill="rgba(255,255,255,0.08)"/>
        
        <!-- Upward Arrow of Progress -->
        <polygon points="21,9 28,19 23,17 23,28 19,28 19,17 14,19" fill="url(#shieldEmberLight)"/>
        
        <!-- Open Book of Knowledge -->
        <path d="M 12 31 C 15 29, 18 29, 21 31 C 24 29, 27 29, 30 31" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 14 34 C 17 32, 19 32, 21 33 C 23 32, 25 32, 28 34" stroke="url(#shieldEmberLight)" stroke-width="1.5" stroke-linecap="round"/>
        
        <!-- Star -->
        <polygon points="21,5 21.8,6.8 23.8,6.8 22.2,8 22.8,9.8 21,8.6 19.2,9.8 19.8,8 18.2,6.8 20.2,6.8" fill="#F59E0B"/>
    </g>

    <!-- ── Typography (White on Dark) ── -->
    <g transform="translate(54, 0)">
        <text x="0" y="14" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#FB923C" letter-spacing="1.2">SINCE 2008 <tspan fill="rgba(255,255,255,0.4)">•</tspan> GOVT. REG.</text>
        <text x="0" y="33" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">SCAIT<tspan fill="url(#shieldEmberLight)">.IN</tspan></text>
        <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">STUDENT COMPUTER ACADEMY</text>
    </g>
</svg>
